<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Ray Hao banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#131a24"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2270C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2270C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F2270C" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="uline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2270C"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <circle cx="980" cy="40" r="150" fill="#F2270C" opacity="0.10">
    <animate attributeName="cx" values="980;1120;980" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="240" r="110" fill="#58A6FF" opacity="0.10">
    <animate attributeName="cx" values="1080;900;1080" dur="11s" repeatCount="indefinite"/>
  </circle>
  <rect width="1200" height="280" fill="url(#beam)"/>
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
    <text x="80" y="118" font-size="58" font-weight="700" fill="#f0f6fc">Ray Hao</text>
    <rect x="82" y="140" height="5" rx="2.5" fill="url(#uline)" width="252">
      <animate attributeName="width" values="0;252" dur="1s" fill="freeze"/>
    </rect>
    <text x="80" y="192" font-size="26" fill="#9da7b3">全栈开发者 / 开源作者 · 上海</text>
    <text x="80" y="232" font-size="22" font-weight="600" fill="#F2270C">youlai-mall · vue3-element-admin · 有来技术</text>
  </g>
</svg>
